name: SAAAdmin
options:
  bundleIdPrefix: com.sabadmintonacademy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone and iPad

targets:
  SAAAdmin:
    type: application
    platform: iOS
    sources:
      - path: SAAAdmin
    info:
      path: SAAAdmin/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sabadmintonacademy.admin
        PRODUCT_NAME: SAAAdmin
        GENERATE_INFOPLIST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: Security.framework
      - sdk: LocalAuthentication.framework
      - sdk: UserNotifications.framework
      - sdk: Network.framework

  SAAAdminTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SAAAdminTests
    settings:
      base:
        GENERATE_INFOPLIST: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sabadmintonacademy.admin.tests
    dependencies:
      - target: SAAAdmin

  SAAAdminUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SAAAdminUITests
    settings:
      base:
        GENERATE_INFOPLIST: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sabadmintonacademy.admin.uitests
    dependencies:
      - target: SAAAdmin
